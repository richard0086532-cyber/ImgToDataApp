<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片转数据 - 异步处理版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            padding: 40px 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; color: #1a1a1a; margin-bottom: 30px; }
        
        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 12px;
            padding: 60px 40px;
            text-align: center;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-area:hover, .upload-area.dragover {
            border-color: #4a90d9;
            background: #f8fbff;
        }
        .upload-area input { display: none; }
        .upload-icon { font-size: 48px; margin-bottom: 15px; }
        
        .progress-panel {
            display: none;
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-top: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e8e8e8;
            border-radius: 4px;
            overflow: hidden;
            margin: 15px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4a90d9, #6ab0f9);
            border-radius: 4px;
            transition: width 0.5s ease;
            width: 0%;
        }
        .status-text { color: #666; font-size: 14px; margin-top: 10px; }
        .status-text.processing { color: #4a90d9; }
        .status-text.completed { color: #52c41a; }
        .status-text.failed { color: #f5222d; }
        
        .log-area {
            background: #1e1e1e;
            color: #d4d4d4;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            font-family: 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.6;
            max-height: 300px;
            overflow-y: auto;
        }
        .log-area .info { color: #6ab0f9; }
        .log-area .success { color: #7ee787; }
        .log-area .error { color: #f85149; }
        
        .result-panel {
            display: none;
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-top: 20px;
        }
        .download-buttons { display: flex; gap: 12px; margin-top: 20px; }
        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary { background: #4a90d9; color: white; }
        .btn-primary:hover { background: #357abd; }
        .btn-secondary { background: #f0f0f0; color: #333; }
        .btn-secondary:hover { background: #e0e0e0; }
        
        .curve-preview {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .curve-preview h4 { margin-bottom: 10px; color: #333; }
        .curve-data { font-family: monospace; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 图片转数据工具（异步版）</h1>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📤</div>
            <p>点击或拖拽上传图片（PNG、JPG、BMP）</p>
            <p style="color: #999; font-size: 13px; margin-top: 8px;">支持批量上传，单张最大 5MB</p>
            <input type="file" id="fileInput" accept="image/*" multiple>
        </div>
        
        <div class="progress-panel" id="progressPanel">
            <h3>🔄 正在处理</h3>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="status-text processing" id="statusText">等待开始...</div>
            <div class="log-area" id="logArea"></div>
        </div>
        
        <div class="result-panel" id="resultPanel">
            <h3>✅ 处理完成</h3>
            <div id="resultContent"></div>
            <div class="download-buttons">
                <a href="#" class="btn btn-primary" id="downloadCSV">📥 下载 CSV</a>
                <a href="#" class="btn btn-secondary" id="downloadJSON">📥 下载 JSON</a>
            </div>
            <div class="curve-preview" id="curvePreview"></div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const progressPanel = document.getElementById('progressPanel');
        const resultPanel = document.getElementById('resultPanel');
        const progressFill = document.getElementById('progressFill');
        const statusText = document.getElementById('statusText');
        const logArea = document.getElementById('logArea');
        
        let pollInterval = null;
        
        // 拖拽上传
        uploadArea.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));
        
        function addLog(message, type = 'info') {
            const div = document.createElement('div');
            div.className = type;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logArea.appendChild(div);
            logArea.scrollTop = logArea.scrollHeight;
        }
        
        async function handleFiles(files) {
            if (files.length === 0) return;
            
            const file = files[0]; // 先处理第一张
            addLog(`开始上传: ${file.name} (${(file.size/1024).toFixed(1)}KB)`);
            
            // 显示进度面板
            progressPanel.style.display = 'block';
            resultPanel.style.display = 'none';
            progressFill.style.width = '0%';
            statusText.textContent = '正在上传...';
            statusText.className = 'status-text processing';
            logArea.innerHTML = '';
            
            // 上传
            const formData = new FormData();
            formData.append('image', file);
            
            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                addLog(`任务创建成功: ${data.task_id}`, 'success');
                addLog(`轮询地址: ${data.check_url}`);
                
                // 开始轮询
                startPolling(data.task_id);
                
            } catch (err) {
                statusText.textContent = `上传失败: ${err.message}`;
                statusText.className = 'status-text failed';
                addLog(`错误: ${err.message}`, 'error');
            }
        }
        
        function startPolling(taskId) {
            if (pollInterval) clearInterval(pollInterval);
            
            let retryCount = 0;
            const maxRetries = 3;
            
            pollInterval = setInterval(async () => {
                try {
                    const res = await fetch(`/api/status/${taskId}`);
                    const data = await res.json();
                    
                    if (data.error && data.error === '任务不存在') {
                        clearInterval(pollInterval);
                        statusText.textContent = '任务丢失';
                        statusText.className = 'status-text failed';
                        return;
                    }
                    
                    // 更新进度
                    progressFill.style.width = `${data.progress}%`;
                    statusText.textContent = `${data.message} (${data.progress}%)`;
                    addLog(data.message);
                    
                    if (data.status === 'completed') {
                        clearInterval(pollInterval);
                        showResult(data);
                    } else if (data.status === 'failed') {
                        clearInterval(pollInterval);
                        statusText.textContent = `处理失败: ${data.error || data.message}`;
                        statusText.className = 'status-text failed';
                        addLog(`失败: ${data.error || data.message}`, 'error');
                    }
                    
                    retryCount = 0; // 重置重试计数
                    
                } catch (err) {
                    retryCount++;
                    addLog(`轮询失败 (${retryCount}/${maxRetries}): ${err.message}`, 'error');
                    
                    if (retryCount >= maxRetries) {
                        clearInterval(pollInterval);
                        statusText.textContent = '轮询超时，请手动刷新';
                        statusText.className = 'status-text failed';
                    }
                }
            }, 2000); // 每 2 秒轮询一次
        }
        
        function showResult(data) {
            progressPanel.style.display = 'none';
            resultPanel.style.display = 'block';
            
            const result = data.result;
            let html = `
                <p><strong>图片尺寸:</strong> ${result.image_size.width} × ${result.image_size.height}</p>
                <p><strong>识别面板:</strong> ${result.panels[0]?.name || '未知'}</p>
                <p><strong>坐标轴范围:</strong> X[${result.axis.x}] Y[${result.axis.y}]</p>
                <p><strong>提取曲线:</strong> ${result.total_curves} 条</p>
            `;
            document.getElementById('resultContent').innerHTML = html;
            
            // 设置下载链接
            document.getElementById('downloadCSV').href = result.download.csv;
            document.getElementById('downloadJSON').href = result.download.json;
            
            // 显示曲线预览
            let previewHtml = '<h4>📈 曲线数据预览</h4>';
            result.curves.forEach(curve => {
                previewHtml += `<div class="curve-data">
                    <strong>${curve.name}:</strong> ${curve.points.length} 个点
                    <br>前5个: ${JSON.stringify(curve.points.slice(0, 5))}
                </div>`;
            });
            document.getElementById('curvePreview').innerHTML = previewHtml;
        }
    </script>
</body>
</html>
